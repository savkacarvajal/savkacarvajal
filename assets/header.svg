<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="bluemoon">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#03081c"/>
      <stop offset="0.55" stop-color="#0a1c4d"/>
      <stop offset="1" stop-color="#0d1117"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#58a6ff" stop-opacity="0.55"/>
      <stop offset="0.55" stop-color="#1f6feb" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#1f6feb" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="moon" cx="0.38" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.6" stop-color="#cfe3ff"/>
      <stop offset="1" stop-color="#7fb2ff"/>
    </radialGradient>
    <linearGradient id="txt" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.5" stop-color="#9cc8ff"/>
      <stop offset="1" stop-color="#58a6ff"/>
    </linearGradient>
    <linearGradient id="trail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9cc8ff" stop-opacity="0"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="1"/>
    </linearGradient>
    <clipPath id="round"><rect width="1200" height="320" rx="18"/></clipPath>
    <filter id="soft"><feGaussianBlur stdDeviation="1.2"/></filter>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1200" height="320" fill="url(#sky)"/>

    <!-- estrellas que titilan -->
    <g fill="#cfe3ff">
      <circle cx="40"  cy="30"  r="1.2" opacity="0.2"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.1s" begin="-0.4s" repeatCount="indefinite"/></circle>
      <circle cx="95"  cy="88"  r="1.6" opacity="0.3"><animate attributeName="opacity" values="0.3;1;0.3" dur="4.2s" begin="-1.2s" repeatCount="indefinite"/></circle>
      <circle cx="150" cy="24"  r="1"   opacity="0.2"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.6s" begin="-2.0s" repeatCount="indefinite"/></circle>
      <circle cx="240" cy="110" r="1.4" opacity="0.3"><animate attributeName="opacity" values="0.3;1;0.3" dur="5.0s" begin="-0.8s" repeatCount="indefinite"/></circle>
      <circle cx="285" cy="40"  r="1.8" opacity="0.2"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.6s" begin="-2.6s" repeatCount="indefinite"/></circle>
      <circle cx="360" cy="90"  r="1"   opacity="0.3"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.9s" begin="-1.6s" repeatCount="indefinite"/></circle>
      <circle cx="410" cy="26"  r="1.5" opacity="0.2"><animate attributeName="opacity" values="0.2;1;0.2" dur="4.6s" begin="-3.1s" repeatCount="indefinite"/></circle>
      <circle cx="520" cy="118" r="1.2" opacity="0.3"><animate attributeName="opacity" values="0.3;1;0.3" dur="3.3s" begin="-0.2s" repeatCount="indefinite"/></circle>
      <circle cx="575" cy="46"  r="2"   opacity="0.2"><animate attributeName="opacity" values="0.2;1;0.2" dur="5.2s" begin="-4.0s" repeatCount="indefinite"/></circle>
      <circle cx="640" cy="20"  r="1"   opacity="0.3"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.4s" begin="-1.0s" repeatCount="indefinite"/></circle>
      <circle cx="690" cy="76"  r="1.4" opacity="0.2"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.8s" begin="-2.2s" repeatCount="indefinite"/></circle>
      <circle cx="735" cy="30"  r="1.6" opacity="0.3"><animate attributeName="opacity" values="0.3;1;0.3" dur="4.4s" begin="-0.6s" repeatCount="indefinite"/></circle>
      <circle cx="800" cy="140" r="1.2" opacity="0.2"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.0s" begin="-3.4s" repeatCount="indefinite"/></circle>
      <circle cx="830" cy="52"  r="1"   opacity="0.3"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.7s" begin="-1.4s" repeatCount="indefinite"/></circle>
      <circle cx="870" cy="112" r="1.8" opacity="0.2"><animate attributeName="opacity" values="0.2;1;0.2" dur="5.4s" begin="-2.8s" repeatCount="indefinite"/></circle>
      <circle cx="1120" cy="35" r="1.4" opacity="0.3"><animate attributeName="opacity" values="0.3;1;0.3" dur="3.5s" begin="-0.9s" repeatCount="indefinite"/></circle>
      <circle cx="1160" cy="105" r="1"  opacity="0.2"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.5s" begin="-1.9s" repeatCount="indefinite"/></circle>
      <circle cx="1090" cy="240" r="1.6" opacity="0.3"><animate attributeName="opacity" values="0.3;1;0.3" dur="4.0s" begin="-3.6s" repeatCount="indefinite"/></circle>
      <circle cx="1170" cy="200" r="1.2" opacity="0.2"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.2s" begin="-0.1s" repeatCount="indefinite"/></circle>
      <circle cx="60"  cy="270" r="1.4" opacity="0.3"><animate attributeName="opacity" values="0.3;1;0.3" dur="4.8s" begin="-2.4s" repeatCount="indefinite"/></circle>
      <circle cx="330" cy="270" r="1"   opacity="0.2"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.8s" begin="-1.1s" repeatCount="indefinite"/></circle>
      <circle cx="470" cy="280" r="1.6" opacity="0.3"><animate attributeName="opacity" values="0.3;1;0.3" dur="3.9s" begin="-3.3s" repeatCount="indefinite"/></circle>
      <circle cx="620" cy="255" r="1.2" opacity="0.2"><animate attributeName="opacity" values="0.2;1;0.2" dur="4.3s" begin="-0.5s" repeatCount="indefinite"/></circle>
      <circle cx="760" cy="285" r="1"   opacity="0.3"><animate attributeName="opacity" values="0.3;1;0.3" dur="3.4s" begin="-2.1s" repeatCount="indefinite"/></circle>
    </g>

    <!-- destellos de 4 puntas que giran -->
    <g fill="#e6f1ff">
      <path d="M180 61 Q180 70 189 70 Q180 70 180 79 Q180 70 171 70 Q180 70 180 61Z">
        <animate attributeName="opacity" values="0.2;1;0.2" dur="3.4s" repeatCount="indefinite"/>
        <animateTransform attributeName="transform" type="rotate" from="0 180 70" to="360 180 70" dur="14s" repeatCount="indefinite"/>
      </path>
      <path d="M470 43 Q470 50 477 50 Q470 50 470 57 Q470 50 463 50 Q470 50 470 43Z">
        <animate attributeName="opacity" values="0.2;1;0.2" dur="3.4s" begin="-1.5s" repeatCount="indefinite"/>
        <animateTransform attributeName="transform" type="rotate" from="0 470 50" to="360 470 50" dur="14s" repeatCount="indefinite"/>
      </path>
      <path d="M760 87 Q760 95 768 95 Q760 95 760 103 Q760 95 752 95 Q760 95 760 87Z">
        <animate attributeName="opacity" values="0.2;1;0.2" dur="3.4s" begin="-3s" repeatCount="indefinite"/>
        <animateTransform attributeName="transform" type="rotate" from="0 760 95" to="360 760 95" dur="14s" repeatCount="indefinite"/>
      </path>
      <path d="M1010 50 Q1010 60 1020 60 Q1010 60 1010 70 Q1010 60 1000 60 Q1010 60 1010 50Z">
        <animate attributeName="opacity" values="0.2;1;0.2" dur="3.4s" begin="-2s" repeatCount="indefinite"/>
        <animateTransform attributeName="transform" type="rotate" from="0 1010 60" to="360 1010 60" dur="14s" repeatCount="indefinite"/>
      </path>
      <path d="M330 204 Q330 210 336 210 Q330 210 330 216 Q330 210 324 210 Q330 210 330 204Z">
        <animate attributeName="opacity" values="0.2;1;0.2" dur="3.4s" begin="-4s" repeatCount="indefinite"/>
        <animateTransform attributeName="transform" type="rotate" from="0 330 210" to="360 330 210" dur="14s" repeatCount="indefinite"/>
      </path>
    </g>

    <!-- estrella fugaz -->
    <g>
      <line x1="-140" y1="0" x2="0" y2="0" stroke="url(#trail)" stroke-width="2.2" stroke-linecap="round"/>
      <animateTransform attributeName="transform" type="translate" values="-200 40; 700 250; 700 250" keyTimes="0;0.16;1" dur="9s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.02;0.12;0.16;1" dur="9s" repeatCount="indefinite"/>
    </g>

    <!-- luna con resplandor -->
    <g transform="translate(985 150)">
      <circle r="150" fill="url(#glow)">
        <animate attributeName="r" values="140;160;140" dur="6s" repeatCount="indefinite"/>
      </circle>
      <g>
        <animateTransform attributeName="transform" type="translate" values="0 0;0 -7;0 0" dur="7s" repeatCount="indefinite"/>
        <circle r="66" fill="url(#moon)"/>
        <circle cx="-18" cy="-14" r="11" fill="#9cc8ff" opacity="0.35"/>
        <circle cx="20"  cy="18"  r="15" fill="#9cc8ff" opacity="0.28"/>
        <circle cx="28"  cy="-26" r="6"  fill="#9cc8ff" opacity="0.30"/>
        <circle cx="-30" cy="28"  r="7"  fill="#9cc8ff" opacity="0.25"/>
      </g>
    </g>

    <!-- bruma baja -->
    <g opacity="0.16" fill="#9cc8ff" filter="url(#soft)">
      <ellipse cx="900"  cy="262" rx="120" ry="12">
        <animateTransform attributeName="transform" type="translate" values="-40 0;40 0;-40 0" dur="16s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse cx="1080" cy="240" rx="90" ry="9">
        <animateTransform attributeName="transform" type="translate" values="30 0;-30 0;30 0" dur="13s" repeatCount="indefinite"/>
      </ellipse>
    </g>

    <!-- texto -->
    <text x="80" y="160" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="92" font-weight="800" fill="url(#txt)" letter-spacing="2">bluemoon
      <animate attributeName="opacity" values="0;1" dur="1.4s" fill="freeze"/>
    </text>
    <text x="84" y="208" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="24" fill="#9cc8ff" letter-spacing="7">REDES  ·  CLOUD  ·  SEGURIDAD  ·  APPS
      <animate attributeName="opacity" values="0;1" dur="2s" begin="0.6s" fill="freeze"/>
    </text>
    <rect x="84" y="228" width="120" height="4" rx="2" fill="#58a6ff">
      <animate attributeName="width" values="0;120;120;240;120" keyTimes="0;0.15;0.5;0.75;1" dur="7s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
