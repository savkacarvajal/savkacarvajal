<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-label="whoami">
  <defs>
    <clipPath id="win"><rect width="1200" height="360" rx="14"/></clipPath>
  </defs>

  <g clip-path="url(#win)">
    <rect width="1200" height="360" fill="#0d0d0d"/>
    <rect width="1200" height="360" fill="none" stroke="#2b2b2b" stroke-width="1"/>

    <!-- barra de titulo -->
    <rect width="1200" height="40" fill="#151515"/>
    <circle cx="24" cy="20" r="6" fill="#ff5f56"/>
    <circle cx="46" cy="20" r="6" fill="#ffbd2e"/>
    <circle cx="68" cy="20" r="6" fill="#27c93f"/>
    <text x="600" y="25" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#9a9a9a" text-anchor="middle">savka &#183; profile shell &#183; online</text>
    <line x1="0" y1="40" x2="1200" y2="40" stroke="#2b2b2b" stroke-width="1"/>

    <!-- separador vertical -->
    <line x1="700" y1="40" x2="700" y2="360" stroke="#2b2b2b" stroke-width="1"/>

    <!-- panel izquierdo -->
    <g font-family="Consolas, 'Courier New', monospace" font-size="17">
      <text x="32" y="80" fill="#c1121f">savka@thynk<tspan fill="#e6e6e6">:~$ </tspan><tspan fill="#f2f2f2">whoami</tspan></text>
      <text x="32" y="114" fill="#f2f2f2">savka &#8211; Estudiante de Ciberseguridad</text>
      <text x="32" y="140" fill="#9a9a9a">INACAP &#183; Ing. en Ciberseguridad &#183; 5to semestre</text>

      <text x="32" y="176" fill="#c1121f">context:<tspan fill="#e6e6e6"> Chile &#128317;</tspan></text>
      <text x="32" y="204" fill="#c1121f">mission:<tspan fill="#e6e6e6"> proteger sistemas y aprender</tspan></text>
      <text x="32" y="226" fill="#e6e6e6">          rompiéndolos (en laboratorio)</text>

      <text x="32" y="262" fill="#c1121f">$ <tspan fill="#f2f2f2">ls expertise/</tspan></text>
      <text x="32" y="288" fill="#e6e6e6">blue-team/  red-team/  redes/  iot-security/</text>

      <text x="32" y="328" fill="#f2f2f2">$ <tspan fill="#f2f2f2">_</tspan>
        <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.51;1" dur="1.1s" repeatCount="indefinite"/>
      </text>
    </g>

    <!-- panel derecho: runtime -->
    <g font-family="Consolas, 'Courier New', monospace" font-size="16">
      <text x="732" y="80" fill="#c1121f">$ <tspan fill="#f2f2f2">cat runtime.status</tspan></text>

      <circle cx="748" cy="118" r="16" fill="#c1121f" opacity="0.85"/>
      <circle cx="742" cy="112" r="4" fill="#0d0d0d" opacity="0.5"/>
      <text x="780" y="124" fill="#f2f2f2" font-size="15">negro-rojo runtime</text>

      <text x="732" y="160" fill="#9a9a9a">org:<tspan fill="#e6e6e6"> THYNK-UNLIMITED &#183; Jefe TI</tspan></text>
      <text x="732" y="186" fill="#9a9a9a">os:<tspan fill="#e6e6e6"> Linux &#183; CachyOS + Hyprland</tspan></text>
      <text x="732" y="212" fill="#9a9a9a">focus:<tspan fill="#e6e6e6"> redes &#183; cloud &#183; hardening</tspan></text>

      <text x="732" y="250" fill="#c1121f">status:<tspan fill="#e6e6e6"> aprendiendo siempre</tspan></text>
      <rect x="732" y="264" width="330" height="6" rx="3" fill="#2b2b2b"/>
      <rect x="732" y="264" width="230" height="6" rx="3" fill="#c1121f">
        <animate attributeName="width" values="180;260;180" dur="4s" repeatCount="indefinite"/>
      </rect>

      <text x="732" y="304" fill="#9a9a9a">uptime:<tspan fill="#e6e6e6"> desde 2022 en GitHub</tspan></text>
    </g>
  </g>
</svg>
